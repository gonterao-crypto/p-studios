			];
			const linkselem = document.getElementById('links');
			const resetelem = document.getElementById('reset');
			let vistlink = JSON.parse(localStorage.getItem('vistlink')) || [];
			links.forEach(item => {
				const c = document.createElement('span');
				const a = document.createElement('a');
				a.href = `https://scratch.mit.edu/studios/${item.id}/`;
				a.textContent = item.name;
				if (vistlink.includes(item.id)) {
					a.className = "stlinkson";
				} else {
					a.className = "stlinks";
				}
				a.addEventListener('mousedown', (e) => {
					if (e.button === 0 || e.button === 1) {
						a.className = "stlinkson";
						vistlink.push(item.id);
			    		localStorage.setItem('vistlink', JSON.stringify(vistlink));
					}
				});
				c.appendChild(a);
				linkselem.appendChild(c);
				const br = document.createElement('br');
				linkselem.appendChild(br);
				if (item.desc) {
					const desc = document.createElement('span');
					desc.textContent = item.desc;
					linkselem.appendChild(desc);
					const br2 = document.createElement('br');
					linkselem.appendChild(br2);
					a.classList.add("stlinksJ");
				}
			});
			resetelem.addEventListener('click', (e) => {
				if (confirm('閲覧履歴を削除しますか?')) {
					localStorage.removeItem('vistlink');
					location.reload();
				}
			});
		</script>
